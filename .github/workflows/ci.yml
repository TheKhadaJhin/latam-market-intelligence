name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=market_intel --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  postgres-and-dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: market_intel
          POSTGRES_USER: market_intel
          POSTGRES_PASSWORD: market_intel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_intel -d market_intel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MARKET_INTEL_DATABASE_URL: postgresql+psycopg://market_intel:market_intel@localhost:5432/market_intel
      DBT_POSTGRES_HOST: localhost
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_USER: market_intel
      DBT_POSTGRES_PASSWORD: market_intel
      DBT_POSTGRES_DB: market_intel
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra postgres --extra warehouse
      - run: uv run alembic upgrade head
      - run: uv run market-intel pipeline --snapshot data/sample/world_bank_snapshot.json --start-year 2015 --end-year 2026
      - run: uv run python scripts/postgres_smoke.py
      - run: cp warehouse/dbt/profiles.yml.example warehouse/dbt/profiles.yml
      - run: uv run --extra warehouse dbt build --project-dir warehouse/dbt --profiles-dir warehouse/dbt

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: latam-market-intelligence:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
