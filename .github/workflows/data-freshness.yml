name: Data Contract Check

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 1 * *"

permissions:
  contents: read

jobs:
  live-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run market-intel pipeline --start-year 2015 --end-year 2026 --no-persist-raw
      - run: uv run market-intel export-rankings --destination data/exports/live-rankings.csv
      - uses: actions/upload-artifact@v4
        with:
          name: live-contract-check
          path: data/exports/live-rankings.csv
          if-no-files-found: error
